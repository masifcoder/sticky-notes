<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>sticky notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>


    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">All Notes</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>


    <div class="container">

        <div class="d-flex justify-content-between align-items-center border-bottom py-3 my-3">
            <h1>Sticky Notes Wall</h1>
            <span class="addNoteBtn" data-bs-toggle="modal" data-bs-target="#sticyNoteForm"><i
                    class="bi bi-plus-lg fs-1"></i></span>
        </div>

        <div class="row" id="notesRow"></div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="sticyNoteForm" tabindex="-1" aria-labelledby="sticyNoteFormLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="sticyNoteFormLabel">Sticky Note Form</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form action="#">
                        <div class="mb-3">
                            <label for="noteTitle" class="form-label">Note Title</label>
                            <input type="text" class="form-control" id="noteTitle" placeholder="Write Note Title">
                        </div>
                        <div class="mb-3">
                            <label for="noteDesc" class="form-label">Note Description</label>
                            <textarea class="form-control" id="noteDesc" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary createNoteBtn">Create Note</button>
                </div>
            </div>
        </div>
    </div>




    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>

        $(document).ready(function () {

            $(".createNoteBtn").on("click", function () {

                // get input values
                let noteTitle = $("#noteTitle").val();
                let noteDesc = $("#noteDesc").val();

                if (noteTitle != "" && noteDesc != "") {

                    // creating note html
                    let noteHtml = `
                        <div class="col-md-3 my-3">
                            <div class="card border-0 shadow-sm sticyNote">
                                <div class="card-body">
                                <h5 class="card-title">${noteTitle}</h5>
                                <p class="card-text">${noteDesc}</p>
                                <a href="#" class="btn btn-danger btn-sm">delete</a>
                                </div>
                            </div>
                        </div>
                    `;

                    // appending child
                    $("#notesRow").append(noteHtml);

                    // empty inputs
                    $("#noteTitle").val("");
                    $("#noteDesc").val("");

                    // close modal
                    $('#sticyNoteForm').modal('hide');


                }

            });



        });


    </script>
</body>

</html>
